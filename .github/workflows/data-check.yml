name: Data check

on: pull_request

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # The offline stages are deterministic: same captures, same JSON.
      - run: python3 tools/extract.py && python3 tools/normalize.py
      - run: git diff --exit-code data/
